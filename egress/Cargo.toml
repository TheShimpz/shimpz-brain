[package]
name = "brain-egress"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
license = "Apache-2.0"
description = "The Brain's only internet route: CONNECT to the catalog's provider hosts on 443 (shimpz-egress brain)"

[dependencies]
egress-transport = { path = "../../.egress/transport" }
strict-json = { path = "../../.standards/strict-json" }

[dev-dependencies]
egress-transport = { path = "../../.egress/transport", features = ["fixtures"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
